
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebRTC Style Transfer</title>
</head>
<body>
    <h2>Style Transfer Test</h2>
    <video id="video" autoplay playsinline muted style="width: 320px; border: 1px solid black;"></video>
    <button onclick="start()">Start</button>
    <button onclick="stop()">Stop</button>
    <div id="status"></div>
    <script>
    var pc = null;
    
    function start() {
        var config = { sdpSemantics: 'unified-plan' };
        pc = new RTCPeerConnection(config);

        pc.addEventListener('track', function(evt) {
            if (evt.track.kind == 'video') {
                document.getElementById('video').srcObject = evt.streams[0];
            }
        });

        navigator.mediaDevices.getUserMedia({ video: true, audio: false }).then(function(stream) {
            stream.getTracks().forEach(track => pc.addTrack(track, stream));
            return pc.createOffer();
        }).then(function(offer) {
            return pc.setLocalDescription(offer);
        }).then(function() {
            return new Promise(function(resolve) {
                if (pc.iceGatheringState === 'complete') {
                    resolve();
                } else {
                    function checkState() {
                        if (pc.iceGatheringState === 'complete') {
                            pc.removeEventListener('icecandidate', checkState);
                            resolve();
                        }
                    }
                    pc.addEventListener('icecandidate', checkState);
                }
            });
        }).then(function() {
            var offer = pc.localDescription;
            return fetch('/offer', {
                body: JSON.stringify({
                    sdp: offer.sdp,
                    type: offer.type,
                }),
                headers: {
                    'Content-Type': 'application/json'
                },
                method: 'POST'
            });
        }).then(function(response) {
            return response.json();
        }).then(function(answer) {
            return pc.setRemoteDescription(answer);
        }).catch(function(e) {
            document.getElementById('status').innerText = e;
        });
    }

    function stop() {
        if (pc) {
            pc.close();
        }
    }
    </script>
</body>
</html>
